server.port=8081
spring.application.name=hospital-backend

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_mgmt?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# dialect auto-detected
spring.jpa.properties.hibernate.format_sql=true
# Prints the SQL statements to your console
spring.jpa.show-sql=true

# Formats the SQL so it spans multiple lines and is readable
spring.jpa.properties.hibernate.format_sql=true

# (Optional) Shows the actual values being injected into the '?' parameters
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# File upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# HuggingFace
huggingface.api.base-url=https://router.huggingface.co/hf-inference/models
huggingface.api.token=

# Logging
logging.level.com.hospital=INFO
logging.level.org.springframework.security=WARN

spring.jpa.open-in-view=false
